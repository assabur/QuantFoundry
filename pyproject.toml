[project]
name = "quantfoundry"
version = "0.1.0"
description = "Pipelines batch PySpark pour le traitement de données de marché et la recherche quantitative"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "dataclasses-json==0.6.7",
    "great-expectations==0.18.22",
    "pandas==2.1.4",
    "polars>=1,<2",
    "pyarrow>=15,<20",
    "pyspark==4.0.0",
    "python-dotenv==1.1.1",
    "pyyaml==6.0.2",
    "requests==2.32.5",
]

[dependency-groups]
dev = [
    "flake8==7.1.0",
    "pytest==8.4.1",
    "pytest-html==4.1.1",
]

[tool.uv]
package = false
