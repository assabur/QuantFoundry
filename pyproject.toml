[project]
name = "aviv-etl"
version = "0.1.0"
description = "Pipeline ETL PySpark configurable vers Parquet et PostgreSQL"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "dataclasses-json==0.6.7",
    "great-expectations==0.18.22",
    "pandas==2.1.4",
    "pyspark==4.0.0",
    "python-dotenv==1.1.1",
    "pyyaml==6.0.2",
    "requests==2.32.5",
]

[dependency-groups]
dev = [
    "flake8==7.1.0",
    "pytest==8.4.1",
    "pytest-html==4.1.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88        # ou 79/120
lint.select = ["E", "W"]  # règles PEP 8 (équiv. pycodestyle)
