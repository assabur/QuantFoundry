name: Lint (PEP8)

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - '.github/workflows/lint.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - '.github/workflows/lint.yml'
  workflow_dispatch:
jobs:
  pep8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install development tools
        run: uv sync --locked --only-group dev

      - name: PEP8 check (E/W only)
        run: uv run --locked --only-group dev flake8 src --select=E,W --max-line-length=79
