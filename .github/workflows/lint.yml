name: Python lint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lint tool
        run: python -m pip install flake8==7.1.0

      - name: Check critical Python errors
        run: python -m flake8 src tests local.py --count --show-source --statistics
